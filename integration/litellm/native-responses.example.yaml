# Merge into your separate LiteLLM configuration; do not replace unrelated models.
# Replace YOUR_PROXY_HOST and port with your actual claudemock endpoint.
# Set CLAUDE_PROXY_API_KEY privately in the LiteLLM environment.
# Messages uses the root API base; native Responses uses /v1.
# These suffixes are gateway aliases, not native Claude model IDs.
model_list:
  - model_name: claude-opus-5-5-claude
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_base: http://YOUR_PROXY_HOST:13456
      api_key: os.environ/CLAUDE_PROXY_API_KEY
  - model_name: claude-opus-5-5-codex
    litellm_params:
      model: openai/claude-opus-5-5
      api_base: http://YOUR_PROXY_HOST:13456/v1
      api_key: os.environ/CLAUDE_PROXY_API_KEY
    model_info:
      mode: responses
      supported_endpoints: ["/v1/responses"]
  - model_name: claude-sonnet-5-5-claude
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_base: http://YOUR_PROXY_HOST:13456
      api_key: os.environ/CLAUDE_PROXY_API_KEY
  - model_name: claude-sonnet-5-5-codex
    litellm_params:
      model: openai/claude-sonnet-5-5
      api_base: http://YOUR_PROXY_HOST:13456/v1
      api_key: os.environ/CLAUDE_PROXY_API_KEY
    model_info:
      mode: responses
      supported_endpoints: ["/v1/responses"]
  - model_name: claude-haiku-5-5-claude
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_base: http://YOUR_PROXY_HOST:13456
      api_key: os.environ/CLAUDE_PROXY_API_KEY
  - model_name: claude-haiku-5-5-codex
    litellm_params:
      model: openai/claude-haiku-5-5
      api_base: http://YOUR_PROXY_HOST:13456/v1
      api_key: os.environ/CLAUDE_PROXY_API_KEY
    model_info:
      mode: responses
      supported_endpoints: ["/v1/responses"]
  - model_name: claude-fable-5-2-claude
    litellm_params:
      model: anthropic/claude-fable-5-2
      api_base: http://YOUR_PROXY_HOST:13456
      api_key: os.environ/CLAUDE_PROXY_API_KEY
  - model_name: claude-fable-5-2-codex
    litellm_params:
      model: openai/claude-fable-5-2
      api_base: http://YOUR_PROXY_HOST:13456/v1
      api_key: os.environ/CLAUDE_PROXY_API_KEY
    model_info:
      mode: responses
      supported_endpoints: ["/v1/responses"]

# Keep existing router policy. For bounded qualification only, disable retries
# and cross-model fallbacks per the test harness; no global policy override here.
